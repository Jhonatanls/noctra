# CI de Noctra: corre en cada pull request y en cada push a dev, test y prod.
# Bloquea el merge si fallan las pruebas, Theme Check o la regla de ramas.
name: CI

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]

permissions:
  contents: read

jobs:
  regla-de-ramas:
    name: Regla de ramas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar origen del pull request
        env:
          ORIGEN: ${{ github.head_ref }}
          DESTINO: ${{ github.base_ref }}
        run: |
          echo "PR de $ORIGEN hacia $DESTINO"
          case "$DESTINO" in
            prod)
              [[ "$ORIGEN" == "test" || "$ORIGEN" == hotfix/* || "$ORIGEN" == sync/* ]] || { echo "::error::A prod solo se llega desde test, hotfix/* o sync/*"; exit 1; } ;;
            test)
              [[ "$ORIGEN" == "dev" || "$ORIGEN" == back/* ]] || { echo "::error::A test solo se llega desde dev o back/*"; exit 1; } ;;
            dev)
              [[ "$ORIGEN" == spec/* || "$ORIGEN" == fix/* || "$ORIGEN" == back/* ]] || { echo "::error::A dev solo se llega desde spec/*, fix/* o back/*"; exit 1; } ;;
          esac

  calidad:
    name: Pruebas y Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del motor de combos
        run: npm test
      - name: combos.js del tema está sincronizado
        run: |
          npm run sync:combos
          git diff --exit-code theme/assets/combos.js || { echo "::error::Ejecuta npm run sync:combos y haz commit"; exit 1; }
      - name: Instalar Shopify CLI
        run: npm install -g @shopify/cli@latest
      - name: Theme Check
        run: shopify theme check --path theme --fail-level error
      - name: Sin marcas de terceros ni réplicas (RNF-13)
        run: |
          if grep -rniE '\b(nike|adidas|jordan|yeezy|new era|puma|reebok|r[eé]plicas?|aaa|1:1)\b' theme/ ; then
            echo "::error::Se encontraron términos prohibidos por RNF-13"; exit 1
          fi
